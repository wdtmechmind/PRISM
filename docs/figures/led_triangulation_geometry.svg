<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#ecf4ff"/>
    </linearGradient>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#35526b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="url(#bg2)"/>
  <text x="700" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#1f2a36">Multi-View LED Triangulation and Pose Estimation</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#223344">
    <circle cx="700" cy="430" r="16" fill="#ff5a5a"/>
    <text x="730" y="437">3D LED point X</text>

    <rect x="130" y="220" width="170" height="95" rx="14" fill="#d9e8ff" stroke="#4b6b8b" stroke-width="2"/>
    <text x="215" y="275" text-anchor="middle">Cam 0</text>

    <rect x="1090" y="220" width="170" height="95" rx="14" fill="#d9e8ff" stroke="#4b6b8b" stroke-width="2"/>
    <text x="1175" y="275" text-anchor="middle">Cam 1</text>

    <rect x="200" y="640" width="170" height="95" rx="14" fill="#d9e8ff" stroke="#4b6b8b" stroke-width="2"/>
    <text x="285" y="695" text-anchor="middle">Cam 2</text>

    <rect x="1030" y="640" width="170" height="95" rx="14" fill="#d9e8ff" stroke="#4b6b8b" stroke-width="2"/>
    <text x="1115" y="695" text-anchor="middle">Cam 3</text>

    <text x="700" y="812" text-anchor="middle" font-size="24" font-weight="600">Ray intersection in least-squares sense</text>
    <text x="700" y="846" text-anchor="middle" font-size="20">Reprojection error gating removes inconsistent views</text>
  </g>

  <g stroke="#35526b" stroke-width="3" fill="none" marker-end="url(#arr2)">
    <line x1="300" y1="315" x2="684" y2="418"/>
    <line x1="1090" y1="315" x2="716" y2="418"/>
    <line x1="370" y1="640" x2="690" y2="446"/>
    <line x1="1030" y1="640" x2="710" y2="446"/>
  </g>

  <g stroke="#8aa6bf" stroke-dasharray="8,8" stroke-width="2" fill="none">
    <line x1="130" y1="267" x2="1090" y2="267"/>
    <line x1="200" y1="687" x2="1200" y2="687"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#2f445a">
    <text x="350" y="360">(u0, v0)</text>
    <text x="1010" y="360">(u1, v1)</text>
    <text x="410" y="615">(u2, v2)</text>
    <text x="980" y="615">(u3, v3)</text>

    <text x="70" y="120" font-size="24" font-weight="600">Key equations:</text>
    <text x="70" y="160">1) Triangulation:  X* = argmin ||A X||,  ||X|| = 1</text>
    <text x="70" y="194">2) Pose fit: min sum ||p_j - (R q_j + t)||^2,  R in SO(3)</text>
  </g>
</svg>
