hand_joints:
  - mechhand_F1_J1
  - mechhand_F1_J2
  - mechhand_F1_J3
  - mechhand_F2_J1
  - mechhand_F2_J2
  - mechhand_F3_J1
  - mechhand_F3_J2
  - mechhand_F4_J1
  - mechhand_F4_J2
  - mechhand_F5_J1
  - mechhand_F5_J2

default_arm_q: [0.0, -1.0, 1.4, 0.0, 1.2, 0.0]
default_hand_pose: five_open

tool_to_hand:
  xyz: [0.0, 0.0, 0.0]
  quat_wxyz: [1.0, 0.0, 0.0, 0.0]
